<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background: #3F5EFB;
            background: radial-gradient(circle, rgb(121, 122, 127) 0%, rgba(249, 249, 249, 0.96) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 330px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px;
        }
        .card img{
            height: 40%;
            border-radius: 100px;
        }
        .card h2{
            font-weight: bold;
            font-size: 1.5rem;
        }
        .card p{
            font-size: 1.2rem;
        }
        .p1{
            color: gray;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 5px;             
        }
        .btn{
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn1{
            background-color: #3F5EFB;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            border: 0px;
        }
        .btn2{
            background-color: #3F5EFB;
            color: #fff;
            padding:8px;
            border-radius: 5px;
            border: 0px;
        }
        .btn3{
            background-color: #3F5EFB;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            border: 0px;
        }
        
        

    </style>
</head>
<body>
    <div class="container">
        <div class="card"> 
            <img src=./sp.jpgk" alt="profile">
            <h2><b>Spiderman</b></h2>
            <p class="p1" style="font-size: 16px;">Senior Creative Designer</p>
            <div>
                <p>📧spidyy@gmail.com</p>
                <p>📞+91 6302 4464 55</p>
            </div>
            <div class="btn">
            <!-- <div class="btns"> -->
            <input class="btn1" type="button" name="submit" id="submit" value="Hacker rank"> <input class="btn2" type="button" name="submit" id="submit" value="Leetcode"> <input class="btn3" type="button" name="submit" id="submit" value="geeks for geeks">
            </div>
            </div>


        </div>

    </div>
     
    
</body>
</html>
